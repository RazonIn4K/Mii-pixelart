# Doppler project binding for this repo.
#
# `doppler setup` reads this so anyone cloning the repo and running
# `doppler run -- pnpm dev` gets the right project/config without thinking
# about it. The actual secrets live in Doppler, not here.
#
# To bootstrap locally:
#   1. `brew install dopplerhq/cli/doppler` (or see docs.doppler.com/cli)
#   2. `doppler login`
#   3. `doppler setup`                  # picks tomodachi-platform / dev for you
#   4. `doppler run -- pnpm dev`        # injects secrets at runtime
#
# Doppler may sync values into the Cloudflare Pages project settings, but an
# already-running Pages Functions deployment keeps the bindings it was
# deployed with. After an approved secret change, create and validate a new
# Pages deployment before revoking the previous provider credential.

setup:
  project: tomodachi-platform
  config: dev
