name: Tomodachi Studio CI

on:
  pull_request:
    paths:
      - "living-the-grid-studio/**"
      - ".github/workflows/tomodachi-studio-ci.yml"
  push:
    branches: [main]
    paths:
      - "living-the-grid-studio/**"
      - ".github/workflows/tomodachi-studio-ci.yml"

permissions:
  contents: read

concurrency:
  group: tomodachi-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: living-the-grid-studio

jobs:
  quality:
    name: Types, tests, build, and Worker packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: living-the-grid-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and types
        run: pnpm verify

      - name: Run Worker tests
        run: pnpm test:worker

      - name: Test release preflight gates
        run: pnpm test:preflight

      - name: Audit production and development dependencies
        run: pnpm verify:security-audit

      - name: Dry-run local Worker package
        run: pnpm worker:dry-run

      - name: Dry-run staging Worker package
        run: pnpm worker:dry-run:staging

      - name: Dry-run production Worker package
        env:
          GOOGLE_CLIENT_ID: ci-release-output-sentinel-client-id
          GOOGLE_CLIENT_SECRET: ci-release-output-sentinel-client-secret
        run: |
          pnpm worker:dry-run:production
          pnpm verify:release-output

      - name: Enforce client bundle budgets
        run: pnpm verify:bundle

  browser:
    name: Browser and accessibility acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: living-the-grid-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply local D1 migrations
        run: pnpm db:migrate:local

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser acceptance suite
        run: pnpm test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            living-the-grid-studio/test-results
            living-the-grid-studio/playwright-report
          if-no-files-found: ignore
          retention-days: 7
